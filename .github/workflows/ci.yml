name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (commitlint / format / affected)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # The cheap whole-repo checks run first for fast feedback; the commit range
      # only exists on pull_request events (pushes to main are already validated
      # by their PR run).
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Check formatting
        run: pnpm format:check

      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5

      - name: Typecheck, test, build (affected)
        run: pnpm exec nx affected -t typecheck test build

      - name: Lint (affected)
        run: pnpm exec nx affected -t lint -- --format=github
