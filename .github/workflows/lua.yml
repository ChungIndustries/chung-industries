name: Lua

# PR-only: unlike ci.yml, whose pushes to main feed nx-set-shas base tracking,
# nothing consumes a run on main, and the PR run already validated the changes.
on:
  pull_request:
    branches: [main]
    paths: ["apps/cpm-cli/**", "packages/cc/cli/**", ".github/workflows/lua.yml"]

permissions:
  contents: read

jobs:
  lua:
    name: Luacheck + StyLua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.3"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install Luacheck
        run: luarocks install luacheck

      - name: Luacheck (cpm-cli)
        working-directory: apps/cpm-cli
        run: luacheck src

      - name: Luacheck (cli)
        working-directory: packages/cc/cli
        run: luacheck src tests

      # The cli library is pure Lua, so its tests run under the plain interpreter
      # installed above; no CC:Tweaked emulator involved.
      - name: Test (cli)
        working-directory: packages/cc/cli
        run: lua tests/run.lua

      - name: StyLua (check)
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check apps/cpm-cli/src packages/cc/cli/src packages/cc/cli/tests
