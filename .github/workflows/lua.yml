name: Lua

# PR-only: unlike ci.yml, whose pushes to main feed nx-set-shas base tracking,
# nothing consumes a run on main, and the PR run already validated the changes.
on:
  pull_request:
    branches: [main]
    paths: ["apps/cpm-cli/**", ".github/workflows/lua.yml"]

permissions:
  contents: read

jobs:
  lua:
    name: Luacheck + StyLua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Lua
        uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.3"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install Luacheck
        run: luarocks install luacheck

      - name: Luacheck
        working-directory: apps/cpm-cli
        run: luacheck src

      - name: StyLua (check)
        uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check apps/cpm-cli/src
