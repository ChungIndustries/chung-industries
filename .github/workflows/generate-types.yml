name: Generate Types

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/supabase/src/types.gen.ts"

permissions:
  contents: read

jobs:
  generate-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase db start

      - name: Verify generated types match Postgres schema
        run: |
          supabase gen types typescript --local > packages/supabase/src/types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet packages/supabase/src/types.gen.ts; then
            echo "Detected uncommitted changes after generating types. See diff below:"
            git diff
            exit 1
          fi
