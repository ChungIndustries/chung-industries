name: Deploy Worker

# One parameterized deploy for every Cloudflare Worker in the workspace.
# Deploys are release-gated: release.yml calls this workflow for each deployable
# project the release includes (detected via the {projectName}@{version} tag).
# workflow_dispatch remains for manual deploys/redeploys of current main.
on:
  workflow_call:
    inputs:
      project:
        description: Workspace project of the Worker to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      project:
        description: Workspace project of the Worker to deploy
        required: true
        type: choice
        options:
          - cpm-registry
          - cpm-web
          - docs

# The deploy talks to Cloudflare, not GitHub; the token only needs to read the repo.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project }}
    runs-on: ubuntu-latest
    environment: production
    # Serialize deploys per project; different Workers may still deploy in parallel.
    concurrency:
      group: deploy-${{ inputs.project }}
      cancel-in-progress: false
    env:
      # Create a Cloudflare API token with Workers Scripts, D1, and R2 edit
      # permissions and add these two repository secrets.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always deploy main, regardless of the calling event's sha.
          ref: main

      - name: Setup
        uses: ./.github/actions/setup

      # Applies any pending D1 migrations to the remote database before the new
      # Worker (which may depend on them) goes live. --if-present makes this a
      # no-op for Workers without a database.
      - name: Apply D1 migrations
        run: pnpm --filter ${{ inputs.project }} run --if-present db:migrate:remote

      # `run deploy`, not `deploy`: pnpm's built-in deploy command shadows the
      # package script of the same name.
      - name: Deploy Worker
        run: pnpm --filter ${{ inputs.project }} run deploy
