name: Release

# Changesets-style release flow, part 2 of 2.
#
# Fires when the automated release PR (from release-pr.yml) is merged. The merged
# commit already carries the version bumps and changelogs; this workflow turns that
# into an actual release by tagging each released project and publishing.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # Recovery hatch: re-runs the publish/deploy half of a release that failed
  # after tagging. Tagging is idempotent (existing tags are a no-op) and the
  # publish/deploy steps fall back to each project's newest tag.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish the merged release
    # Only the merge (not a plain close) of the release branch, and only when
    # merged - or a manual recovery dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/next')
    runs-on: ubuntu-latest
    outputs:
      cpm-registry-version: ${{ steps.released.outputs.cpm-registry-version }}
      cpm-cli-version: ${{ steps.released.outputs.cpm-cli-version }}
      docs-version: ${{ steps.released.outputs.docs-version }}
    steps:
      - name: Checkout main (post-merge)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Needed so the tag step can reliably tell which tags already exist
          # (makes re-running a completed release a clean no-op instead of a
          # failed push against an existing remote tag).
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The prepare phase deliberately did not tag. Detect the released projects
      # from the merge commit, tag each as {projectName}@{version}, push the
      # tags, and create a GitHub Release per tag with the changelog section as
      # notes. Uses only git, node builtins, and the preinstalled gh CLI, so no
      # dependency install is needed here (add the setup action if that changes).
      # On a recovery dispatch, HEAD is not necessarily a release commit; skip.
      - name: Tag released projects and create GitHub Releases
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs tag

      # Which deployable projects were part of this release, detected via the
      # {projectName}@{version} tags just created; writes a <project>-version
      # output per released project. Gates the Scalar publish below and the
      # deploy jobs. A recovery dispatch falls back to each project's newest
      # tag, re-publishing that release's artifacts from main.
      - name: Detect released project versions
        id: released
        run: node tools/release.mjs released ${{ github.event_name == 'workflow_dispatch' && '--fallback-latest' || '' }}

      # @scalar/cli requires Node >= 24; the runner default is older, and this
      # job intentionally skips the full pnpm setup action.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      # Publishes the committed (CI-verified) OpenAPI spec to the Scalar registry,
      # versioned by the release tag. Kept for the Scalar features that consume
      # the registry document (SDK and MCP generation); the API reference itself
      # is served by the `docs` app. Scalar's hosted docs site is deliberately
      # not published: `scalar project publish` is gated behind paid plans
      # (verified 2026-08-25, even in preview mode).
      - name: Publish CPM Registry spec to Scalar
        env:
          SCALAR_API_KEY: ${{ secrets.SCALAR_API_KEY }}
          version: ${{ steps.released.outputs.cpm-registry-version }}
        run: |
          if [ -z "$version" ]; then
            echo "cpm-registry was not released in this run, skipping Scalar publish."
            exit 0
          fi
          if [ -z "$SCALAR_API_KEY" ]; then
            echo "::warning::SCALAR_API_KEY is not set, skipping Scalar publish for cpm-registry@$version."
            exit 0
          fi
          echo "Publishing cpm-registry@$version spec to Scalar."
          # Pinned for reproducibility. Bump deliberately after checking the CLI changelog.
          npm install -g @scalar/cli@2.1.0
          scalar auth login --token "$SCALAR_API_KEY"
          # A version that is already in the Scalar registry is the expected state on a
          # recovery dispatch, not a failure; Scalar refuses the overwrite without --force
          # and this deliberately never forces (published spec versions stay immutable).
          output="$(scalar registry publish apps/cpm-registry/openapi.yaml --slug cpm-registry --version "$version" 2>&1)" || {
            if echo "$output" | grep -q "Overriding an existing version"; then
              echo "cpm-registry@$version is already in the Scalar registry; nothing to do."
              exit 0
            fi
            echo "$output"
            exit 1
          }
          echo "$output"

      # Tidy up so the next release starts from a fresh branch (best-effort; the repo
      # may already auto-delete merged branches). Uses the checkout-persisted token.
      - name: Delete release branch
        if: github.event_name == 'pull_request'
        run: git push origin --delete release/next || true

  # Deploys ride the release train: only a release that includes a deployable
  # project ships its Worker. Manual deploys stay available via the called
  # workflows' workflow_dispatch triggers.
  deploy-cpm-registry:
    name: Deploy CPM Registry
    needs: release
    if: needs.release.outputs.cpm-registry-version != ''
    uses: ./.github/workflows/deploy-worker.yml
    with:
      project: cpm-registry
    secrets: inherit

  deploy-docs:
    name: Deploy Docs
    needs: release
    if: needs.release.outputs.docs-version != ''
    uses: ./.github/workflows/deploy-worker.yml
    with:
      project: docs
    secrets: inherit

  # Publishing cpm to the registry rides the release train too: a release that
  # includes cpm-cli builds the tarball and uploads it. Ordered after the
  # registry deploy so a release shipping both never publishes against the old
  # Worker; the !failure() guard (not the default success()) lets it run when
  # the deploy was skipped because the release had no registry changes. The
  # registry rejects re-publishes of an existing version with a 409, which the
  # publish script treats as success, so recovery dispatches are idempotent.
  publish-cpm-cli:
    name: Publish cpm to the registry
    needs: [release, deploy-cpm-registry]
    if: ${{ !failure() && !cancelled() && needs.release.outputs.cpm-cli-version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always publish from main, matching the deploy workflows.
          ref: main

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build tarball
        run: pnpm --filter cpm-cli build

      # The CPM_REGISTRY_URL repository variable is the publish target and is
      # required: the script has no fallback URL and fails when it is unset.
      - name: Publish to the registry
        env:
          CPM_REGISTRY_URL: ${{ vars.CPM_REGISTRY_URL }}
        run: pnpm --filter cpm-cli publish:registry
