name: Setup
description: Install pnpm, Node, Go, and dependencies (run checkout first)

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: "pnpm"

    # The cpm tool (apps/cpm-tool) is Go; the Lua packages' build and publish
    # targets run it from source, so every lane that may touch them needs it.
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: apps/cpm-tool/go.mod
        cache-dependency-path: apps/cpm-tool/go.sum

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
