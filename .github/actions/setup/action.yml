name: Setup
description: Install pnpm, Node, and dependencies (run checkout first)

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
