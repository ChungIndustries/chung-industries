  /resolve:
    post:
      tags:
        - Packages
      summary: Resolve dependencies
      description: "Pins one version per package for the given root dependencies and
        their transitive dependencies. Each spec may be a semver range, an exact
        version, or a dist-tag. Every requester of a package must agree on a
        single version (the client installs into a flat store): the highest
        version satisfying all requested ranges is chosen, and unsatisfiable
        combinations fail. Results are ordered dependencies-first."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Pinned packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: object
                    properties:
                      packages:
                        type: array
                        items:
                          $ref: "#/components/schemas/PackageVersion"
                    required:
                      - packages
                required:
                  - status
                  - data
        "400":
          description: Invalid request or unsatisfiable dependencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - fail
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        minLength: 1
                    required:
                      - message
                required:
                  - status
                  - data
        "404":
