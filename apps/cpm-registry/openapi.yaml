  /packages/{name}/{version}/dist/bundle:
    get:
      tags:
        - Packages
      summary: Download bundle
      description: "Returns the bundle for a specific package version: the artifact
        the in-game cpm client installs from. Format: `<manifest byte
        length>\\n<minified manifest JSON><raw concatenated file bytes>`, where
        the manifest is `{ name, version, files: [{ path, offset, length }] }`
        with offsets relative to the first byte after the manifest. Served
        gzip-encoded on the wire to clients that send `Accept-Encoding: gzip`;
        `dist.bundle.sha256` is the SHA-256 of the decoded bytes."
      parameters:
        - schema:
            type: string
            minLength: 1
            example: example
          required: true
          name: name
          in: path
        - schema:
            type: string
            example: 1.0.0
            description: Semantic version string
          required: true
          description: Semantic version string
          name: version
          in: path
      responses:
        "200":
          description: Bundle bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
