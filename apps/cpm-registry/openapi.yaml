  /packages/{name}/{version}/dist/bundle:
    get:
      tags:
        - Packages
      summary: Download bundle
      description: "Downloads the bundle for this version, which is what the in-game
        cpm client installs from. It starts with the manifest's byte length and
        a newline, then the minified manifest JSON, then the raw file bytes back
        to back. The manifest is `{ name, version, files: [{ path, offset,
        length }] }`, with offsets counted from the first byte after the
        manifest. Clients that send `Accept-Encoding: gzip` get it gzip-encoded
        on the wire; `dist.bundle.sha256` is the SHA-256 of the decoded bytes."
      parameters:
        - schema:
            type: string
            minLength: 1
            example: example
          required: true
          name: name
          in: path
        - schema:
            type: string
            example: 1.0.0
            description: A semantic version
          required: true
          description: A semantic version
          name: version
          in: path
      responses:
        "200":
          description: The bundle
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid version
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - fail
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        minLength: 1
                    required:
                      - message
                required:
                  - status
                  - data
        "404":
          description: Package or version not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - fail
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        minLength: 1
                    required:
                      - message
                required:
                  - status
                  - data
        "500":
          description: Something went wrong on the registry's side
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    minLength: 1
                required:
                  - status
                  - message
  /resolve:
    post:
      tags:
        - Packages
      summary: Resolve dependencies
      description: "Picks one version for each of the given dependencies and for
        everything they depend on in turn. Each spec can be a semver range, an
        exact version, or a dist-tag. The client installs into a flat store, so
        every package gets a single version: the highest one that satisfies
        everyone asking for it. If no version can, the request fails. The result
        lists dependencies before the packages that need them."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Pinned packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: object
                    properties:
                      packages:
                        type: array
                        items:
                          $ref: "#/components/schemas/PackageVersion"
                    required:
                      - packages
                required:
                  - status
                  - data
        "400":
          description: Invalid request or unsatisfiable dependencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - fail
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        minLength: 1
                    required:
                      - message
                required:
                  - status
                  - data
        "404":
          description: Package not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - fail
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        minLength: 1
                    required:
                      - message
                required:
                  - status
                  - data
        "500":
          description: Something went wrong on the registry's side
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    minLength: 1
                required:
                  - status
                  - message
  /install:
    get:
      tags:
        - Bootstrap
      summary: Bootstrap installer
      description: Serves the cpm installer as plain Lua, straight from the latest
        published `cpm` package. On a fresh CC:Tweaked computer, run `wget run
        https://registry.cpm.chungindustries.com/install`.
      responses:
        "200":
          description: The installer
          content:
            text/plain:
              schema:
                type: string
                example: -- cpm installer
        "404":
          description: cpm has not been published yet
          content:
            application/json:
              schema:
